<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DD Hunt Tracker — Sign in</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20261116icon">
  <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png?v=20261116icon">
  <link rel="icon" type="image/png" href="/favicon.png?v=20261116icon">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="DD Hunt Tracker">
  <meta name="application-name" content="DD Hunt Tracker">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1B3A2A">
  <style>
    :root {
      --cream: #F7F4EA;
      --green: #1B3A2A;
      --error-bg: #f8e6e6;
      --error-text: #8B2E2E;
      --muted: #4a5c52;
      --border: #c5c0b0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--cream);
      color: var(--green);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .logo {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      object-fit: cover;
      background: var(--cream);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 600;
      margin: 16px 0 4px;
    }
    h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 28px 0 16px;
    }
    form { text-align: left; }
    label {
      display: block;
      font-weight: 600;
      margin: 14px 0 6px;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      font-size: 16px;
      line-height: 1.3;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--green);
    }
    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: 2px solid var(--green);
      outline-offset: 1px;
    }
    .stay {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0;
      font-weight: 500;
    }
    .stay input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--green);
    }
    .stay label { margin: 0; font-weight: 500; }
    button[type="submit"] {
      width: 100%;
      font-size: 17px;
      font-weight: 600;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--green);
      color: var(--cream);
      cursor: pointer;
    }
    button[type="submit"]:hover { filter: brightness(1.08); }
    .error {
      background: var(--error-bg);
      color: var(--error-text);
      padding: 12px 14px;
      border-radius: 10px;
      margin: 0 0 8px;
      font-weight: 500;
    }
    .caption {
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.45;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/apple-touch-icon.png?v=20261116icon" width="120" height="120" alt="DD Hunt Tracker">
    <h1>DD Hunt Tracker</h1>
    <h2>Secure Club Access</h2>
    __ERROR_BLOCK__
    <form method="post" action="/login" autocomplete="on">
      <label for="username">Username</label>
      <input type="text" name="username" id="username" autocomplete="username"
             autocapitalize="none" autocorrect="off" spellcheck="false"
             value="__USERNAME_VALUE__" required>

      <label for="password">Password</label>
      <input type="password" name="password" id="password" autocomplete="current-password" required>

      <div class="stay">
        <input type="checkbox" name="stay_logged_in" id="stay_logged_in" value="1" checked>
        <label for="stay_logged_in">Stay logged in</label>
      </div>

      <button type="submit">Login</button>
    </form>
    <p class="caption">Sign in with your email or club username. Stay logged in keeps you signed in on this phone or computer for 30 days.</p>
  </main>
</body>
</html>
